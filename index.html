<!DOCTYPE html>
<!-- AT-0 — the master cover sheet (docs/SITE_FRAMEWORK.md "AT-series").
     data-family: the cover takes drafting, the site's blueprint anchor, rather
     than any one set's accent — it belongs to the whole site, not to a tool. -->
<html lang="en" data-family="drafting">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>architecture.tools</title>
<meta name="description" content="Tools for architects: a hardware picker for CPU, GPU, RAM, monitor and laptop choices, and a precise unit converter.">
<link rel="canonical" href="https://architecture.tools/">
<meta property="og:type" content="website">
<meta property="og:url" content="https://architecture.tools/">
<meta property="og:title" content="architecture.tools">
<meta property="og:description" content="Tools for architects: a hardware picker for CPU, GPU, RAM, monitor and laptop choices, and a precise unit converter.">
<meta name="twitter:card" content="summary">
<script>
// Resolve the color scheme before first paint: a stored choice wins, else
// follow the system. The shared dark tokens key off html[data-scheme="dark"].
(function(){
  var stored = null;
  try { stored = localStorage.getItem('scheme'); } catch (e) {}
  var dark = stored ? stored === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.scheme = dark ? 'dark' : 'light';
})();
</script>
<link rel="stylesheet" href="assets/css/global.css">
<style>
  /* ---- page-specific only ----
     The sheet, the crumb, the scheme toggle and the palette are shared
     (assets/css/global.css + tokens.css). What's local is the cover's
     landscape layout and its index. */

  /* The sheet is worked in landscape, the way a drawing sheet is: the title
     block holds the left edge, a heavy division separates it, and the index
     runs down the field. The index sets the height — min-height is only a
     floor, so the field grows as tools are added and never clips. */
  /* the shared sheet reserves 5rem at the foot for scrolling content; a cover
     is framed evenly instead, top and bottom */
  .cover { padding-bottom: var(--space-2xl); }
  /* position + the right gutter host the scheme toggle, as .page-header does */
  .cover-stamp { position: relative; min-height: 2.25rem; padding-right: 3rem; margin-bottom: var(--space-lg); }
  .cover-stamp .page-crumb { margin-bottom: 0; }
  .cover-body { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 8fr); min-height: 24rem; }
  .cover-title { display: flex; flex-direction: column; padding-right: var(--space-2xl); }
  .cover-title h1 { font-size: var(--text-2xl); font-weight: 400; letter-spacing: -0.02em; line-height: 1.1; }
  .cover-date { margin-top: auto; font-size: var(--text-xs); font-weight: 300; color: var(--ink-3); }
  .cover-index { padding-left: var(--space-2xl); border-left: var(--border-heavy); }

  /* SHEET INDEX — one ruled row per live tool, grouped by set. A row is a
     whole link, so the target is the row and not just the title. */
  .index-group { margin-bottom: var(--space-xl); }
  .index-group:last-child { margin-bottom: 0; }
  .index-row {
    display: block; position: relative;
    padding: 0.8rem 2rem 0.8rem 0;
    border-top: 1px solid var(--rule);
    color: inherit; text-decoration: none;
  }
  .index-row:last-of-type { border-bottom: 1px solid var(--rule); }
  .index-row::after {
    content: '\2192'; position: absolute; right: 0.15rem; top: 0.85rem;
    color: var(--ink-3); transition: transform 0.15s, color 0.15s;
  }
  .index-row:hover::after { transform: translateX(3px); color: var(--accent); }
  .index-row:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .index-name { display: block; font-size: var(--text-md); font-weight: 400; transition: color 0.15s; }
  .index-row:hover .index-name { color: var(--accent); }
  .index-desc { display: block; margin-top: 0.15rem;
                font-size: var(--text-sm); font-weight: 300; color: var(--ink-2); line-height: 1.55; }

  /* Portrait below the wide breakpoint: the division turns horizontal and the
     title block sits above the field, as it does on every other page. */
  @media (max-width: 820px) {
    .cover-body { grid-template-columns: 1fr; min-height: 0; }
    .cover-title { padding-right: 0; padding-bottom: var(--space-xl); }
    .cover-title h1 { font-size: var(--text-xl); }
    .cover-date { margin-top: var(--space-md); }
    .cover-index { padding-left: 0; padding-top: var(--space-xl); border-left: none; border-top: var(--border-heavy); }
  }
</style>
</head>
<body>
<div class="page-wide cover">

  <div class="cover-stamp">
    <!-- the cover's own stamp; it's the top of the set, so there's no trail -->
    <div class="page-crumb">AT-0 &middot; Cover sheet</div>
    <!-- light/dark key — shared style (global.css) + wiring (assets/js/ui.js) -->
    <button type="button" class="scheme-toggle">
      <svg class="icon-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
      <svg class="icon-sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
    </button>
  </div>

  <div class="cover-body">
    <div class="cover-title">
      <h1>architecture.tools</h1>
      <div class="cover-date">Updated August 2026</div>
    </div>

    <div class="cover-index">
      <div class="index-group">
        <div class="section-label">Live recommendations</div>
        <a class="index-row" href="picker.html">
          <span class="index-name">Computer Chooser</span>
          <span class="index-desc">CPU, GPU, RAM, monitor and laptop picks from your software, project scale and budget.</span>
        </a>
      </div>

      <div class="index-group">
        <div class="section-label">Calculators</div>
        <a class="index-row" href="calculators/convert.html">
          <span class="index-name">Precise Unit Converter</span>
          <span class="index-desc">Exact conversions, with the cost of rounding shown.</span>
        </a>
        <!-- Next calculator goes here: copy one .index-row block, point it at
             the new page, and give it a one-line description. Nothing else. -->
      </div>
    </div>
  </div>
</div>

<script src="assets/js/ui.js"></script>
</body>
</html>
